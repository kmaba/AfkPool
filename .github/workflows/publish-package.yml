name: Publish AfkPool to GitHub Packages

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}
        cache: 'maven'

    - name: Build with Maven
      run: mvn -B clean package --file pom.xml

    - name: Publish to GitHub Packages Apache Maven
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set +e
        OUTPUT=$(mvn deploy -s $GITHUB_WORKSPACE/settings.xml 2>&1)
        STATUS=$?
        set -e
        echo "$OUTPUT" | tail -20
        if [ $STATUS -ne 0 ] && ! echo "$OUTPUT" | grep -q "status code: 422"; then
          exit 1
        fi
        if echo "$OUTPUT" | grep -q "status code: 422"; then
          echo "Package version already exists on GitHub Packages; skipping deploy."
        fi

    - name: Upload JAR to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: target/*.jar
